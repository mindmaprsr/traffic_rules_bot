services:
  backend:
    build:
      context: ./backend
    env_file: .env
    volumes:
      - ./data:/app/data:ro
      - chroma_db:/app/chroma_db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    env_file: .env
    environment:
      - API_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_db:
